services:
  plata-postgres-dev:
    image: postgres:17
    environment:
      POSTGRES_DB: plata
      POSTGRES_USER: plata
      POSTGRES_PASSWORD: plata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plata -d plata"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
